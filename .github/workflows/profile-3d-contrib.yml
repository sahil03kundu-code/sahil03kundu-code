name: Generate 3D Contribution Graph
 
on:
  schedule:
    - cron: "0 1 * * *"   # regenerates once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
 
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
 
      - uses: yoshi389111/github-profile-3d-contrib@0.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: sahil03kundu-code
 
      - name: Commit the generated graph to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f profile-3d-contrib/*.svg
          git commit -m "chore: update 3D contribution graph" || echo "No changes to commit"
          git push